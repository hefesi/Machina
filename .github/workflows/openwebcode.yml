name: openwebcode

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model"
        required: false
        default: "opencode-go/deepseek-v4-pro"
        type: string

      prompt:
        description: "Prompt for opencode"
        required: true
        type: string

      target_branch:
        description: "Existing branch to update"
        required: false
        type: string

      skip_pr:
        description: "Push changes without opening a PR"
        required: false
        default: false
        type: boolean

      timeout:
        description: "Max run time in minutes"
        required: false
        default: "30"
        type: string

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # Use our fork until upstream supports target_branch/skip_pr for workflow_dispatch follow-ups.
        uses: dobrinyonkov/opencode/github@workflow-dispatch-branch-options
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}
          target_branch: ${{ inputs.target_branch }}
          skip_pr: ${{ inputs.skip_pr }}
